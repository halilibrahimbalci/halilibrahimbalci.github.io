<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namaz Takip – İndir</title>
<meta name="description" content="Namaz Takip: kaza takibi, namaz vakitleri, kıble ve Kur'an-ı Kerim. Ücretsiz ve reklamsız.">
<meta property="og:title" content="Namaz Takip – Kaza, Vakit, Kıble ve Kur'an">
<meta property="og:description" content="Ücretsiz ve reklamsız. iPhone ve Android için indirin.">
<meta property="og:image" content="https://halilibrahimbalci.github.io/namaztakip/icon.png">
<link rel="icon" href="../icon.png">
<script>
  // Telefonun türüne göre doğru mağazaya yönlendir
  (function () {
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    if (ios) location.replace("https://apps.apple.com/tr/app/id6834882084");
    else if (android) location.replace("https://play.google.com/store/apps/details?id=com.halilibrahim.namaztakip");
  })();
</script>
<style>
  :root { --bg:#f7faf8; --fg:#1b2420; --muted:#5d6b65; --accent:#0f6e56; --card:#ffffff; --line:#dfe7e3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --fg:#e4ece8; --muted:#9aa8a2; --accent:#55dbb3; --card:#1a211e; --line:#2a3430; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:24px 16px; }
  main { width:100%; max-width:420px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 24px; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { margin:16px 0 4px; font-size:1.5rem; }
  p { margin:0 0 24px; color:var(--muted); }
  a.btn { display:block; padding:14px; margin-top:12px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; }
  @media (prefers-color-scheme: dark) { a.btn { color:#0b1f19; } }
  small { display:block; margin-top:24px; color:var(--muted); }
  small a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="Namaz Takip simgesi">
  <h1>Namaz Takip</h1>
  <p>Kaza takibi · Namaz vakitleri · Kıble · Kur'an-ı Kerim<br>Ücretsiz ve reklamsız</p>
  <a class="btn" href="https://apps.apple.com/tr/app/id6834882084">iPhone için App Store'dan indir</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.halilibrahim.namaztakip">Android için Google Play'den indir</a>
  <small>Merhume Hüsniye Balcı'nın aziz hatırasına. Bir Fatiha okumanız yeter. 🤲<br>
  <a href="../">Gizlilik ve destek</a></small>
</main>
</body>
</html>
